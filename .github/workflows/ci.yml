name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install required dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            g++ \
            flex \
            bison \
            libfl-dev \
            llvm \
            llvm-dev \
            clang \
            clang-format \
            cmake \
            ninja-build

      - name: Verify required tools
        run: |
          set -euo pipefail
          command -v make
          command -v g++
          command -v flex
          command -v bison
          command -v llvm-config
          command -v lli
          command -v llc
          command -v clang
          command -v clang++
          command -v cmake
          command -v ninja
          command -v base64
          command -v timeout
          command -v curl
          llvm-config --version
          lli --version
          llc --version
          clang --version
          cmake --version
          ninja --version

      - name: CI status hygiene guard
        run: bash scripts/check_ci_status_hygiene.sh

      - name: PR73 safety contract guard
        run: bash scripts/check_fuzz_safety_contract.sh

      - name: PR75 portability contract guard
        run: |
          bash scripts/check_toolchain_platform_contract.sh
          bash tests/ci/test_toolchain_platform_contract_negative.sh
          bash tests/ci/test_cmake_ctest_parity_negative.sh

      - name: Setup build infrastructure
        run: bash setup_build_infra.sh

      - name: Strict language validation
        run: source ./shorthand_env.sh && bash scripts/validate_language.sh --strict

      - name: AST source range guard
        run: bash scripts/check_ast_source_ranges.sh

      - name: Diagnostics coverage matrix
        run: bash scripts/check_diagnostics_coverage_matrix.sh

      - name: Grammar and conformance matrix beta-0.2
        run: bash scripts/check_grammar_conformance_matrix.sh

      - name: Module import package syntax beta-0.3
        run: bash scripts/check_module_ast_scaffold.sh

      - name: Module resolver unit gate
        run: bash scripts/check_module_resolver_unit.sh

      - name: Module resolver and multi-file codegen
        run: bash scripts/check_module_resolution.sh

      - name: Semantic differential execution
        run: bash scripts/check_semantic_differential.sh

      - name: Fuzz ASan LSan UBSan compiler stages
        run: bash scripts/check_fuzz_sanitizers.sh

      - name: Runtime ASan LSan UBSan stress
        run: bash scripts/check_runtime_memory_sanitizer.sh

      - name: ThreadSanitizer race stress
        run: bash scripts/check_thread_sanitizer.sh

      - name: Parser robustness and negative corpus
        run: bash scripts/check_parser_robustness.sh

      - name: Compiler test strategy and coverage audit
        run: bash scripts/check_compiler_test_strategy.sh

      - name: Smoke tests
        run: bash scripts/smoke_test.sh

      - name: Feature plan status check
        run: bash scripts/check_feature_plan_status.sh

      - name: Enterprise hardening check
        run: bash scripts/check_enterprise_hardening.sh

      - name: Makefile test suite
        run: make -C Compiler_new_ws/Short_Hand/src test

      - name: Certification bundle smoke
        run: bash scripts/generate_certification_bundle.sh Compiler_new_ws/Short_Hand/examples/ai_onnx_fallback.short /tmp/shorthand_c3eco_bundle

      - name: Sanitizer tests
        run: make -C Compiler_new_ws/Short_Hand/src sanitize

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja

      - name: Build with CMake
        run: cmake --build build

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-logs-ubuntu-core-${{ github.run_id }}
          path: |
            /tmp/shorthand_*.out
            /tmp/shorthand_*.err
            /tmp/short_hand_*.out
            /tmp/short_hand_*.err
            /tmp/shorthand_semantic_differential.json
            /tmp/shorthand_fuzz_artifacts/
            /tmp/shorthand_c3eco_bundle/
            Compiler_new_ws/Short_Hand/build/
            build/

  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gcc-12
            cc: gcc-12
            cxx: g++-12
          - id: gcc-14
            cc: gcc-14
            cxx: g++-14
          - id: clang-16
            cc: clang-16
            cxx: clang++-16
          - id: clang-18
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install matrix build dependencies
        run: |
          set -euo pipefail
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          sudo apt-get "${APT_OPTS[@]}" update
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            build-essential flex bison libfl-dev llvm-18 llvm-18-dev clang-16 clang-18 g++-12 g++-14 cmake ninja-build

      - name: Record matrix toolchain
        run: |
          set -euo pipefail
          command -v "${CC}"
          command -v "${CXX}"
          command -v llvm-config-18
          "${CXX}" --version
          test "$(llvm-config-18 --version | cut -d. -f1)" = "18"
          llvm-config-18 --version
          uname -a

      - name: Configure matrix compiler
        run: cmake -S . -B build-toolchain -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_CONFIG=/usr/bin/llvm-config-18

      - name: Build matrix compiler and runtime
        run: cmake --build build-toolchain --parallel 2 --target short_hand shorthand_runtime green_ai_tool

      - name: Execute matrix compiler smoke
        run: |
          set -euo pipefail
          build-toolchain/short_hand tests/semantic/differential/core_control.short run > /tmp/shorthand_toolchain_${{ matrix.id }}.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_toolchain_${{ matrix.id }}.out
          build-toolchain/short_hand tests/semantic/differential/core_control.short parse >/tmp/shorthand_toolchain_${{ matrix.id }}_parse.out

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Linux arm64 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ flex bison libfl-dev llvm llvm-dev clang cmake ninja-build

      - name: Record Linux arm64 environment
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v llvm-config
          llvm-config --version
          clang --version

      - name: Configure Linux arm64 compiler
        run: cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/stage-arm64"

      - name: Build Linux arm64 compiler and runtime
        run: |
          cmake --build build-arm64 --parallel 2

      - name: Execute Linux arm64 interpreter bitcode and native
        run: |
          set -euo pipefail
          build-arm64/short_hand tests/semantic/differential/core_control.short run > /tmp/shorthand_arm64_run.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_arm64_run.out
          build-arm64/short_hand tests/semantic/differential/core_control.short compile-bc > /tmp/shorthand_arm64_compile_bc.out
          lli output.bc > /tmp/shorthand_arm64_lli.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_arm64_lli.out
          build-arm64/short_hand tests/semantic/differential/core_control.short compile-native > /tmp/shorthand_arm64_compile_native.out
          ./output.native > /tmp/shorthand_arm64_native.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_arm64_native.out
          cmake --install build-arm64
          "$PWD/stage-arm64/bin/short_hand" tests/semantic/differential/core_control.short parse > /tmp/shorthand_arm64_install_smoke.out

  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install macOS ARM64 dependencies
        run: brew install flex bison llvm cmake ninja

      - name: Record macOS ARM64 environment
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          BREW_PREFIX="$(brew --prefix)"
          LLVM_CONFIG="${BREW_PREFIX}/opt/llvm/bin/llvm-config"
          test -x "${LLVM_CONFIG}"
          "${LLVM_CONFIG}" --version
          clang++ --version

      - name: Configure macOS ARM64 compiler
        run: |
          BREW_PREFIX="$(brew --prefix)"
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_CONFIG="${BREW_PREFIX}/opt/llvm/bin/llvm-config"

      - name: Build macOS ARM64 compiler and runtime
        run: cmake --build build-macos --parallel 2 --target short_hand shorthand_runtime green_ai_tool

      - name: Execute macOS ARM64 interpreter bitcode and native
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix llvm)/bin:${PATH}"
          build-macos/short_hand tests/semantic/differential/core_control.short run > /tmp/shorthand_macos_run.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_macos_run.out
          build-macos/short_hand tests/semantic/differential/core_control.short compile-bc > /tmp/shorthand_macos_compile_bc.out
          lli output.bc > /tmp/shorthand_macos_lli.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_macos_lli.out
          build-macos/short_hand tests/semantic/differential/core_control.short compile-native > /tmp/shorthand_macos_compile_native.out
          ./output.native > /tmp/shorthand_macos_native.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_macos_native.out

  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure Windows x64 compiler
        shell: pwsh
        run: |
          $llvmDir = Get-ChildItem 'C:\Program Files\LLVM' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($llvmDir) {
            $llvmConfig = Join-Path $llvmDir.FullName 'bin\llvm-config.exe'
          } else {
            $llvmConfig = (Get-Command llvm-config.exe -ErrorAction Stop).Source
          }
          cmake -S . -B build-windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DLLVM_CONFIG="$llvmConfig"

      - name: Build Windows x64 compiler and runtime
        shell: pwsh
        run: cmake --build build-windows --parallel 2 --target short_hand shorthand_runtime green_ai_tool

      - name: Execute Windows x64 interpreter and compiler parse
        shell: pwsh
        run: |
          .\build-windows\short_hand.exe tests\semantic\differential\core_control.short run | Out-File -Encoding ascii $env:TEMP\shorthand_windows_run.out
          $actual = (Get-Content $env:TEMP\shorthand_windows_run.out -Raw).Trim()
          $expected = (Get-Content tests\semantic\differential\core_control.expected -Raw).Trim()
          if ($actual -ne $expected) { throw "Windows interpreter output mismatch" }
          .\build-windows\short_hand.exe tests\semantic\differential\core_control.short parse | Out-File -Encoding ascii $env:TEMP\shorthand_windows_parse.out

  ctest-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install CTest parity dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ flex bison libfl-dev llvm llvm-dev clang cmake ninja-build

      - name: Make-vs-CTest parity gate
        run: bash scripts/check_cmake_ctest_parity.sh

  reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install reproducibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ flex bison libfl-dev llvm llvm-dev clang cmake ninja-build

      - name: Independent clean-build reproducibility
        run: bash scripts/check_reproducible_builds.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reproducibility-${{ github.run_id }}
          path: |
            /tmp/shorthand_reproducibility.json
            /tmp/shorthand-reproducibility/

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install security build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libfl-dev llvm-18 llvm-18-dev clang-18 cmake ninja-build jq

      - name: Security policy and negative matrix
        run: bash scripts/check_external_security_policy.sh

      - name: Repository-owned dependency delta review
        env:
          SHORTHAND_DEPENDENCY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          SHORTHAND_DEPENDENCY_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="${SHORTHAND_DEPENDENCY_BASE_REF}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          bash scripts/check_dependency_delta.sh "${base}" "${SHORTHAND_DEPENDENCY_HEAD_REF}"

      - name: Initialize CodeQL C/C++ security analysis
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build compiler for CodeQL
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build-codeql -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLLVM_CONFIG=/usr/bin/llvm-config-18
          cmake --build build-codeql --parallel 2 --target short_hand shorthand_runtime green_ai_tool

      - name: Produce CodeQL SARIF without weakening local enforcement
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          output: /tmp/shorthand-codeql-results
          upload: never
          upload-database: false

      - name: Enforce CodeQL high-severity policy
        run: bash scripts/check_codeql_sarif.sh /tmp/shorthand-codeql-results

      - name: Trivy repository vulnerability secret misconfiguration and license scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: /tmp/shorthand-trivy-repository.json
          exit-code: '0'
          ignore-unfixed: 'false'
          skip-dirs: tests/security/fixtures,build,build-codeql,Compiler_new_ws/Short_Hand/build
          trivyignores: security/.trivyignore

      - name: Enforce Trivy repository policy
        run: bash scripts/check_trivy_report.sh /tmp/shorthand-trivy-repository.json

      - name: Generate vulnerable dependency scanner fixture
        run: bash scripts/create_vulnerable_dependency_fixture.sh /tmp/shorthand-vulnerable-dependency-fixture

      - name: Scan vulnerable dependency fixture
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          skip-setup-trivy: 'true'
          scan-type: fs
          scan-ref: /tmp/shorthand-vulnerable-dependency-fixture
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: /tmp/shorthand-trivy-vulnerable-fixture.json
          exit-code: '0'
          ignore-unfixed: 'false'

      - name: Require vulnerable dependency detection
        run: bash scripts/assert_trivy_vulnerable_fixture.sh /tmp/shorthand-trivy-vulnerable-fixture.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-evidence-${{ github.run_id }}-${{ github.event_name }}
          path: |
            /tmp/shorthand-codeql-results/
            /tmp/shorthand-trivy-repository.json
            /tmp/shorthand-trivy-vulnerable-fixture.json
            /tmp/shorthand_dependency_delta.json
            /tmp/shorthand_security_*.out
            /tmp/shorthand_security_*.err

  ubuntu:
    needs:
      - ubuntu-core
      - toolchain
      - linux-arm64
      - macos-arm64
      - windows-x64
      - ctest-parity
      - reproducible
      - security
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Require all Ubuntu CI prerequisites
        env:
          UBUNTU_CORE_RESULT: ${{ needs.ubuntu-core.result }}
          TOOLCHAIN_RESULT: ${{ needs.toolchain.result }}
          LINUX_ARM64_RESULT: ${{ needs.linux-arm64.result }}
          MACOS_ARM64_RESULT: ${{ needs.macos-arm64.result }}
          WINDOWS_X64_RESULT: ${{ needs.windows-x64.result }}
          CTEST_PARITY_RESULT: ${{ needs.ctest-parity.result }}
          REPRODUCIBLE_RESULT: ${{ needs.reproducible.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          for result in \
            "${UBUNTU_CORE_RESULT}" \
            "${TOOLCHAIN_RESULT}" \
            "${LINUX_ARM64_RESULT}" \
            "${MACOS_ARM64_RESULT}" \
            "${WINDOWS_X64_RESULT}" \
            "${CTEST_PARITY_RESULT}" \
            "${REPRODUCIBLE_RESULT}" \
            "${SECURITY_RESULT}"; do
            test "${result}" = "success"
          done

      - name: Publish stable event-specific CI status
        if: ${{ always() && !cancelled() && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          sha = os.environ["HEAD_SHA"]
          event = os.environ["EVENT_NAME"]
          context = f"ci / ubuntu ({event})"
          body = json.dumps({
              "state": "success",
              "context": context,
              "description": f"Ubuntu CI passed for {event}",
              "target_url": f"https://github.com/{repository}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise SystemExit(f"status publish failed: HTTP {response.status}")
          PY

      - name: Publish stable event-specific CI failure
        if: ${{ always() && !cancelled() && failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          sha = os.environ["HEAD_SHA"]
          event = os.environ["EVENT_NAME"]
          context = f"ci / ubuntu ({event})"
          body = json.dumps({
              "state": "failure",
              "context": context,
              "description": f"Ubuntu CI failure for {event}",
              "target_url": f"https://github.com/{repository}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise SystemExit(f"status publish failed: HTTP {response.status}")
          PY
