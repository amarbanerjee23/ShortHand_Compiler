name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install required dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            g++ \
            flex \
            bison \
            libfl-dev \
            llvm \
            llvm-dev \
            clang \
            clang-format \
            cmake \
            ninja-build \
            jq

      - name: Verify required tools
        run: |
          set -euo pipefail
          command -v make
          command -v g++
          command -v flex
          command -v bison
          command -v llvm-config
          command -v lli
          command -v llc
          command -v clang
          command -v clang++
          command -v cmake
          command -v ninja
          command -v base64
          command -v timeout
          command -v curl
          command -v jq
          llvm-config --version
          lli --version
          llc --version
          clang --version
          cmake --version
          ninja --version

      - name: CI status hygiene guard
        run: bash scripts/check_ci_status_hygiene.sh

      - name: PR73 safety contract guard
        run: bash scripts/check_fuzz_safety_contract.sh

      - name: PR75 portability contract guard
        run: |
          bash scripts/check_toolchain_platform_contract.sh
          bash tests/ci/test_toolchain_platform_contract_negative.sh
          bash tests/ci/test_cmake_ctest_parity_negative.sh

      - name: Setup build infrastructure
        run: bash setup_build_infra.sh

      - name: Strict language validation
        run: source ./shorthand_env.sh && bash scripts/validate_language.sh --strict

      - name: AST source range guard
        run: bash scripts/check_ast_source_ranges.sh

      - name: Diagnostics coverage matrix
        run: bash scripts/check_diagnostics_coverage_matrix.sh

      - name: Grammar and conformance matrix beta-0.2
        run: bash scripts/check_grammar_conformance_matrix.sh

      - name: Module import package syntax beta-0.3
        run: bash scripts/check_module_ast_scaffold.sh

      - name: Module resolver unit gate
        run: bash scripts/check_module_resolver_unit.sh

      - name: Module resolver and multi-file codegen
        run: bash scripts/check_module_resolution.sh

      - name: Semantic differential execution
        run: bash scripts/check_semantic_differential.sh

      - name: Fuzz ASan LSan UBSan compiler stages
        run: bash scripts/check_fuzz_sanitizers.sh

      - name: Runtime ASan LSan UBSan stress
        run: bash scripts/check_runtime_memory_sanitizer.sh

      - name: ThreadSanitizer race stress
        run: bash scripts/check_thread_sanitizer.sh

      - name: Parser robustness and negative corpus
        run: bash scripts/check_parser_robustness.sh

      - name: Compiler test strategy and coverage audit
        run: bash scripts/check_compiler_test_strategy.sh

      - name: Smoke tests
        run: bash scripts/smoke_test.sh

      - name: Feature plan status check
        run: bash scripts/check_feature_plan_status.sh

      - name: Enterprise hardening check
        run: bash scripts/check_enterprise_hardening.sh

      - name: Makefile test suite
        run: make -C Compiler_new_ws/Short_Hand/src test

      - name: Certification bundle smoke
        run: bash scripts/generate_certification_bundle.sh Compiler_new_ws/Short_Hand/examples/ai_onnx_fallback.short /tmp/shorthand_c3eco_bundle

      - name: Sanitizer tests
        run: make -C Compiler_new_ws/Short_Hand/src sanitize

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja

      - name: Build with CMake
        run: cmake --build build

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-logs-ubuntu-core-${{ github.run_id }}
          path: |
            /tmp/shorthand_*.out
            /tmp/shorthand_*.err
            /tmp/short_hand_*.out
            /tmp/short_hand_*.err
            /tmp/shorthand_semantic_differential.json
            /tmp/shorthand_fuzz_artifacts/
            /tmp/shorthand_c3eco_bundle/
            Compiler_new_ws/Short_Hand/build/
            build/

  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gcc-12
            cc: gcc-12
            cxx: g++-12
          - id: gcc-14
            cc: gcc-14
            cxx: g++-14
          - id: clang-16
            cc: clang-16
            cxx: clang++-16
          - id: clang-18
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install matrix build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libfl-dev llvm llvm-dev clang gcc-12 g++-12 gcc-14 g++-14 clang-16 clang-18
      - name: Record matrix toolchain
        run: |
          "${CC}" --version
          "${CXX}" --version
          llvm-config --version
      - name: Configure matrix compiler
        run: cmake -S . -B "build-${{ matrix.id }}" -G Ninja -DCMAKE_C_COMPILER="${CC}" -DCMAKE_CXX_COMPILER="${CXX}"
      - name: Build matrix compiler and runtime
        run: cmake --build "build-${{ matrix.id }}"
      - name: Execute matrix compiler smoke
        run: |
          "build-${{ matrix.id }}/short_hand" Compiler_new_ws/Short_Hand/examples/simple.short run
          "build-${{ matrix.id }}/short_hand" Compiler_new_ws/Short_Hand/examples/simple.short compile-native
          ./simple

  ctest-parity:
    needs: ubuntu-core
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install CTest parity dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libfl-dev llvm llvm-dev clang cmake ninja-build
      - name: Configure CTest parity build
        run: cmake -S . -B build-ctest -G Ninja
      - name: Build CTest parity target
        run: cmake --build build-ctest
      - name: Run CTest parity suite
        run: ctest --test-dir build-ctest --output-on-failure

  reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install reproducibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libfl-dev llvm llvm-dev clang cmake ninja-build
      - name: Independent clean-build reproducibility
        run: bash scripts/check_reproducible_builds.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reproducibility-${{ github.run_id }}
          path: /tmp/shorthand_repro/

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Linux arm64 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libfl-dev llvm llvm-dev clang cmake ninja-build
      - name: Record Linux arm64 environment
        run: |
          uname -a
          uname -m | grep -Eq 'aarch64|arm64'
          llvm-config --version
          clang --version
      - name: Build Linux arm64 compiler and runtime
        run: cmake -S . -B build-linux-arm64 -G Ninja && cmake --build build-linux-arm64
      - name: Execute Linux arm64 interpreter bitcode and native
        run: |
          build-linux-arm64/short_hand Compiler_new_ws/Short_Hand/examples/simple.short run
          build-linux-arm64/short_hand Compiler_new_ws/Short_Hand/examples/simple.short compile-bc
          lli output.bc
          build-linux-arm64/short_hand Compiler_new_ws/Short_Hand/examples/simple.short compile-native
          ./simple
      - name: Install upgrade uninstall Linux arm64 SDK lifecycle
        run: bash scripts/check_installed_sdk_lifecycle.sh build-linux-arm64

  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install macOS build dependencies
        run: |
          brew install bison flex llvm cmake ninja
      - name: Record macOS Apple Silicon environment
        run: |
          uname -a
          test "$(uname -m)" = arm64
          /opt/homebrew/opt/llvm/bin/llvm-config --version
          clang --version
      - name: Build macOS Apple Silicon compiler and runtime
        env:
          PATH: /opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:/opt/homebrew/opt/llvm/bin:${{ env.PATH }}
          LDFLAGS: -L/opt/homebrew/opt/flex/lib
        run: cmake -S . -B build-macos-arm64 -G Ninja && cmake --build build-macos-arm64
      - name: Execute macOS interpreter bitcode and native
        env:
          PATH: /opt/homebrew/opt/llvm/bin:${{ env.PATH }}
        run: |
          build-macos-arm64/short_hand Compiler_new_ws/Short_Hand/examples/simple.short run
          build-macos-arm64/short_hand Compiler_new_ws/Short_Hand/examples/simple.short compile-bc
          lli output.bc
          build-macos-arm64/short_hand Compiler_new_ws/Short_Hand/examples/simple.short compile-native
          ./simple
      - name: Install upgrade uninstall macOS arm64 SDK lifecycle
        env:
          PATH: /opt/homebrew/opt/llvm/bin:${{ env.PATH }}
        run: bash scripts/check_installed_sdk_lifecycle.sh build-macos-arm64

  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 50
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            flex
            bison
            diffutils
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Record Windows UCRT64 environment
        run: |
          uname -a
          gcc --version
          clang --version
          llvm-config --version
          cmake --version
      - name: Build Windows compiler and runtime
        run: cmake -S . -B build-windows-x64 -G Ninja && cmake --build build-windows-x64
      - name: Execute Windows interpreter bitcode native and runtime negative
        run: |
          build-windows-x64/short_hand.exe Compiler_new_ws/Short_Hand/examples/simple.short run
          build-windows-x64/short_hand.exe Compiler_new_ws/Short_Hand/examples/simple.short compile-bc
          lli output.bc
          build-windows-x64/short_hand.exe Compiler_new_ws/Short_Hand/examples/simple.short compile-native
          ./simple.exe
          bash tests/runtime/test_unknown_backend.sh
      - name: Install upgrade uninstall Windows SDK lifecycle
        run: bash scripts/check_installed_sdk_lifecycle.sh build-windows-x64

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install security build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libfl-dev llvm llvm-dev clang cmake ninja-build
      - name: Security policy and negative matrix
        run: |
          bash scripts/check_external_security_policy.sh
          bash tests/security/test_external_security_policy_negative.sh
          bash tests/security/test_security_scanner_negative.sh
          bash tests/security/test_third_party_license_policy_negative.sh
          bash tests/security/test_security_exceptions_negative.sh
          bash tests/ci/test_action_pinning_negative.sh
      - name: Repository-owned dependency delta review
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.sha }}
        run: bash scripts/check_dependency_delta.sh
      - name: Initialize CodeQL C/C++ security analysis
        uses: github/codeql-action/init@2d92b92925cc2d933db4d9b0295f98e8e7a90520
        with:
          languages: cpp
          queries: security-extended
      - name: Build compiler for CodeQL
        run: make -C Compiler_new_ws/Short_Hand/src short_hand
      - name: Produce CodeQL SARIF without weakening local enforcement
        uses: github/codeql-action/analyze@2d92b92925cc2d933db4d9b0295f98e8e7a90520
        with:
          category: /language:cpp
          upload: false
          output: /tmp/codeql-results
      - name: Enforce CodeQL high-severity policy
        run: bash scripts/check_codeql_sarif.sh /tmp/codeql-results
      - name: Trivy repository vulnerability secret misconfiguration and license scan
        uses: aquasecurity/trivy-action@5c982ed124462852ea7844d59f98f690e1d369a0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: /tmp/trivy-repository.json
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Enforce Trivy repository policy
        run: bash scripts/check_trivy_report.sh /tmp/trivy-repository.json
      - name: Generate vulnerable dependency scanner fixture
        run: bash tests/security/create_vulnerable_dependency_fixture.sh /tmp/shorthand-vulnerable-fixture
      - name: Scan vulnerable dependency fixture
        uses: aquasecurity/trivy-action@5c982ed124462852ea7844d59f98f690e1d369a0
        with:
          scan-type: fs
          scan-ref: /tmp/shorthand-vulnerable-fixture
          format: json
          output: /tmp/trivy-vulnerable-fixture.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Require vulnerable dependency detection
        run: bash scripts/check_vulnerable_dependency_fixture.sh /tmp/trivy-vulnerable-fixture.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-evidence-${{ github.run_id }}
          path: |
            /tmp/codeql-results/
            /tmp/trivy-repository.json
            /tmp/trivy-vulnerable-fixture.json
