name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4

      - name: Install required dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            g++ \
            flex \
            bison \
            libfl-dev \
            llvm \
            llvm-dev \
            clang \
            clang-format \
            cmake \
            ninja-build

      - name: Verify required tools
        run: |
          set -euo pipefail
          command -v make
          command -v g++
          command -v flex
          command -v bison
          command -v llvm-config
          command -v lli
          command -v llc
          command -v clang
          command -v clang++
          command -v cmake
          command -v ninja
          command -v base64
          command -v timeout
          command -v curl
          llvm-config --version
          lli --version
          llc --version
          clang --version
          cmake --version
          ninja --version

      - name: CI status hygiene guard
        run: bash scripts/check_ci_status_hygiene.sh

      - name: PR73 safety contract guard
        run: bash scripts/check_fuzz_safety_contract.sh

      - name: PR75 portability contract guard
        run: |
          bash scripts/check_toolchain_platform_contract.sh
          bash tests/ci/test_toolchain_platform_contract_negative.sh
          bash tests/ci/test_cmake_ctest_parity_negative.sh

      - name: Setup build infrastructure
        run: bash setup_build_infra.sh

      - name: Strict language validation
        run: source ./shorthand_env.sh && bash scripts/validate_language.sh --strict

      - name: AST source range guard
        run: bash scripts/check_ast_source_ranges.sh

      - name: Diagnostics coverage matrix
        run: bash scripts/check_diagnostics_coverage_matrix.sh

      - name: Grammar and conformance matrix beta-0.2
        run: bash scripts/check_grammar_conformance_matrix.sh

      - name: Module import package syntax beta-0.3
        run: bash scripts/check_module_ast_scaffold.sh

      - name: Module resolver unit gate
        run: bash scripts/check_module_resolver_unit.sh

      - name: Module resolver and multi-file codegen
        run: bash scripts/check_module_resolution.sh

      - name: Semantic differential execution
        run: bash scripts/check_semantic_differential.sh

      - name: Fuzz ASan LSan UBSan compiler stages
        run: bash scripts/check_fuzz_sanitizers.sh

      - name: Runtime ASan LSan UBSan stress
        run: bash scripts/check_runtime_memory_sanitizer.sh

      - name: ThreadSanitizer race stress
        run: bash scripts/check_thread_sanitizer.sh

      - name: Parser robustness and negative corpus
        run: bash scripts/check_parser_robustness.sh

      - name: Compiler test strategy and coverage audit
        run: bash scripts/check_compiler_test_strategy.sh

      - name: Smoke tests
        run: bash scripts/smoke_test.sh

      - name: Feature plan status check
        run: bash scripts/check_feature_plan_status.sh

      - name: Enterprise hardening check
        run: bash scripts/check_enterprise_hardening.sh

      - name: Makefile test suite
        run: make -C Compiler_new_ws/Short_Hand/src test

      - name: Certification bundle smoke
        run: bash scripts/generate_certification_bundle.sh Compiler_new_ws/Short_Hand/examples/ai_onnx_fallback.short /tmp/shorthand_c3eco_bundle

      - name: Sanitizer tests
        run: make -C Compiler_new_ws/Short_Hand/src sanitize

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja

      - name: Build with CMake
        run: cmake --build build

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-ubuntu-core-${{ github.run_id }}
          path: |
            /tmp/shorthand_*.out
            /tmp/shorthand_*.err
            /tmp/short_hand_*.out
            /tmp/short_hand_*.err
            /tmp/shorthand_semantic_differential.json
            /tmp/shorthand_fuzz_artifacts/
            /tmp/shorthand_c3eco_bundle/
            Compiler_new_ws/Short_Hand/build/
            build/

  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gcc-12
            cc: gcc-12
            cxx: g++-12
          - id: gcc-14
            cc: gcc-14
            cxx: g++-14
          - id: clang-16
            cc: clang-16
            cxx: clang++-16
          - id: clang-18
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Install matrix build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libfl-dev llvm-18 llvm-18-dev clang-16 clang-18 g++-12 g++-14 cmake ninja-build

      - name: Record matrix toolchain
        run: |
          set -euo pipefail
          command -v "${CC}"
          command -v "${CXX}"
          command -v llvm-config-18
          "${CXX}" --version
          llvm-config-18 --version
          uname -a

      - name: Configure matrix compiler
        run: cmake -S . -B build-toolchain -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_CONFIG=/usr/bin/llvm-config-18

      - name: Build matrix compiler and runtime
        run: cmake --build build-toolchain --parallel 2 --target short_hand shorthand_runtime green_ai_tool

      - name: Execute matrix compiler smoke
        run: |
          set -euo pipefail
          build-toolchain/short_hand tests/semantic/differential/core_control.short run > /tmp/shorthand_toolchain_${{ matrix.id }}.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_toolchain_${{ matrix.id }}.out
          build-toolchain/short_hand tests/conformance/fixtures/base/int_bool_ops.short parse >/tmp/shorthand_toolchain_${{ matrix.id }}_parse.out

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux arm64 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ flex bison libfl-dev llvm llvm-dev clang cmake ninja-build

      - name: Record Linux arm64 environment
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          clang++ --version
          llvm-config --version

      - name: Build Linux arm64 compiler and runtime
        run: |
          cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/stage-arm64"
          cmake --build build-arm64 --parallel 2

      - name: Execute Linux arm64 compiler smoke
        run: |
          set -euo pipefail
          build-arm64/short_hand tests/semantic/differential/core_control.short run > /tmp/shorthand_arm64.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_arm64.out
          build-arm64/short_hand tests/semantic/differential/core_control.short compile-bc
          test -s core_control.bc
          lli core_control.bc > /tmp/shorthand_arm64_lli.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_arm64_lli.out

      - name: Install and consume Linux arm64 SDK
        run: |
          cmake --install build-arm64
          bash scripts/check_installed_consumer_cmake.sh "$PWD/stage-arm64" "$PWD/consumer-arm64"

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - name: Install macOS build dependencies
        run: |
          brew install bison flex llvm@18 ninja
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"

      - name: Record macOS Apple Silicon environment
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          "$(brew --prefix llvm@18)/bin/clang++" --version
          "$(brew --prefix llvm@18)/bin/llvm-config" --version
          sw_vers

      - name: Build macOS Apple Silicon compiler and runtime
        env:
          CC: /opt/homebrew/opt/llvm@18/bin/clang
          CXX: /opt/homebrew/opt/llvm@18/bin/clang++
        run: |
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage-macos" \
            -DLLVM_CONFIG="$(brew --prefix llvm@18)/bin/llvm-config"
          cmake --build build-macos --parallel 2

      - name: Execute macOS compiler smoke
        run: |
          set -euo pipefail
          build-macos/short_hand tests/semantic/differential/core_control.short run > /tmp/shorthand_macos.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_macos.out
          build-macos/short_hand tests/semantic/differential/core_control.short compile-bc
          test -s core_control.bc
          "$(brew --prefix llvm@18)/bin/lli" core_control.bc > /tmp/shorthand_macos_lli.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_macos_lli.out

      - name: Install and consume macOS SDK
        run: |
          cmake --install build-macos
          bash scripts/check_installed_consumer_cmake.sh "$PWD/stage-macos" "$PWD/consumer-macos"

  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: 1
    defaults:
      run:
        shell: 'C:\msys64\usr\bin\bash.exe -leo pipefail {0}'

    steps:
      - uses: actions/checkout@v4

      - name: Install Windows UCRT64 compiler dependencies
        run: |
          pacman -S --noconfirm --needed \
            mingw-w64-ucrt-x86_64-clang \
            mingw-w64-ucrt-x86_64-llvm \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja \
            bison flex make diffutils

      - name: Record Windows UCRT64 environment
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:${PATH}"
          clang++ --version
          llvm-config --version
          cmake --version
          uname -a

      - name: Build Windows compiler and runtime
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:${PATH}"
          export CC=clang
          export CXX=clang++
          cmake -S . -B build-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage-windows" \
            -DLLVM_CONFIG=/ucrt64/bin/llvm-config.exe
          cmake --build build-windows --parallel 2

      - name: Execute Windows compiler semantic smoke
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:${PATH}"
          ./build-windows/short_hand.exe tests/semantic/differential/core_control.short run > /tmp/shorthand_windows.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_windows.out
          ./build-windows/short_hand.exe tests/semantic/differential/core_control.short compile-bc
          test -s core_control.bc
          lli core_control.bc > /tmp/shorthand_windows_lli.out
          diff -u tests/semantic/differential/core_control.expected /tmp/shorthand_windows_lli.out

      - name: Install and consume Windows SDK
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:${PATH}"
          cmake --install build-windows
          bash scripts/check_installed_consumer_cmake.sh "$PWD/stage-windows" "$PWD/consumer-windows"

  ctest-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install CTest parity dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ flex bison libfl-dev llvm llvm-dev clang cmake ninja-build

      - name: Verify CTest parity manifest
        run: |
          bash scripts/check_cmake_ctest_parity.sh
          bash tests/ci/test_cmake_ctest_parity_negative.sh

      - name: Execute Makefile suite through CTest
        env:
          SHORTHAND_CTEST_PARITY_EXECUTE: '1'
        run: bash scripts/check_cmake_ctest_parity.sh

  reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Install reproducibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ flex bison libfl-dev llvm llvm-dev clang cmake ninja-build

      - name: Independent clean-build reproducibility
        run: bash scripts/check_reproducible_builds.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducibility-${{ github.run_id }}
          path: |
            /tmp/shorthand_reproducibility.json
            /tmp/shorthand-reproducibility/

  ubuntu:
    needs:
      - ubuntu-core
      - toolchain
      - linux-arm64
      - macos-arm64
      - windows-x64
      - ctest-parity
      - reproducible
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Verify mandatory CI DAG results
        run: |
          set -euo pipefail
          test "${{ needs.ubuntu-core.result }}" = "success"
          test "${{ needs.toolchain.result }}" = "success"
          test "${{ needs.linux-arm64.result }}" = "success"
          test "${{ needs.macos-arm64.result }}" = "success"
          test "${{ needs.windows-x64.result }}" = "success"
          test "${{ needs.ctest-parity.result }}" = "success"
          test "${{ needs.reproducible.result }}" = "success"

      - name: Publish event-specific CI status
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "${JOB_STATUS}" == "success" ]]; then
            state=success
          fi
          payload="$(printf '{\"state\":\"%s\",\"target_url\":\"%s\",\"description\":\"Ubuntu CI %s for %s\",\"context\":\"ci / ubuntu (%s)\"}' \
            "${state}" "${RUN_URL}" "${state}" "${EVENT_NAME}" "${EVENT_NAME}")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "${payload}"
