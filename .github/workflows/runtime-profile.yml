name: runtime-profile

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: runtime-profile-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ORT_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Initialize evidence even if a later build fails
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 experiments/energy/ci_run_evidence.py --output profile-output --initialize
          base="${PR_BASE_SHA:-${PUSH_BASE_SHA:-}}"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$base^{commit}"
          echo "EVIDENCE_BASE_SHA=$base" >> "$GITHUB_ENV"
          git rev-parse HEAD > profile-output/pr-head-sha.txt
          printf '%s\n' "$base" > profile-output/pr-base-sha.txt
      - name: Require committed benchmark document in every PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 scripts/check_pr_benchmark_report.py --base "$EVIDENCE_BASE_SHA" --head "$(git rev-parse HEAD)" \
            | tee profile-output/committed-report-check.txt
      - name: Install build dependencies
        run: |
          set -euo pipefail
          APT_SOURCES=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${APT_SOURCES[@]}" update
          sudo apt-get "${APT_SOURCES[@]}" install -y build-essential clang-18 llvm-18-dev llvm-18-tools libmlir-18-dev mlir-18-tools cmake ninja-build python3 python3-venv time flex bison libfl-dev libssl-dev curl binutils
      - name: Install locked Python baseline
        run: |
          set -euo pipefail
          python3 -m venv baseline-venv
          baseline-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r tests/ai_application/requirements-ai-baseline-linux-x64-py312.txt
          baseline-venv/bin/python -m pip freeze --all > profile-output/pip-freeze.txt
      - name: Build optimized real ONNX host
        run: |
          set -euo pipefail
          bash scripts/install_ci_onnxruntime_cpu.sh "$PWD/build-profile/onnxruntime-1.30.0"
          cmake -S . -B build-profile -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DSHORTHAND_BUILD_TESTING=OFF -DSHORTHAND_BUILD_MLIR=ON -DSHORTHAND_MLIR_TESTING=OFF \
            -DSHORTHAND_BUILD_RUNTIME_PHASE_PROFILE=ON \
            -DMLIR_DIR=/usr/lib/llvm-18/lib/cmake/mlir \
            -DLLVM_CONFIG=/usr/bin/llvm-config-18 \
            -DSHORTHAND_ENABLE_ONNXRUNTIME=ON -DSHORTHAND_STRICT_OPTIONAL_BACKENDS=ON \
            -DONNXRUNTIME_ROOT="$PWD/build-profile/onnxruntime-1.30.0"
          cmake --build build-profile --parallel 2 --target short_hand shorthand_ai_qualify shorthand_runtime shorthand_runtime_profiled 2>&1 | tee profile-output/build.log
          cp build-profile/CMakeCache.txt profile-output/
          git rev-parse HEAD > profile-output/revision.txt
          sha256sum build-profile/shorthand_ai_qualify > profile-output/executable.sha256
          clang++-18 --version > profile-output/compiler.txt
          lscpu --json > profile-output/lscpu.json
      - name: Verify profiling and application boundaries
        run: |
          set -euo pipefail
          {
          python3 experiments/energy/test_profile_report.py
          python3 experiments/energy/test_resident_baselines.py
          python3 experiments/energy/test_ci_energy_evidence.py
          python3 experiments/energy/test_ci_energy_compare.py
          python3 experiments/energy/test_pr_runtime_delta.py
          python3 experiments/energy/test_energy_status.py
          python3 experiments/energy/test_generated_infer_evidence.py
          python3 experiments/energy/test_ci_run_evidence.py
          python3 experiments/energy/test_render_benchmark_markdown.py
          python3 scripts/test_pr_benchmark_report.py
          baseline-venv/bin/python experiments/energy/test_experiments.py
          echo 'PASS evidence regression suites'
          } | tee profile-output/evidence-tests.txt
          python3 tests/ai_application/test_application.py "$PWD" "$PWD/build-profile/shorthand_ai_qualify" "$PWD/profile-output/tests" 1 | tee profile-output/application-tests.txt
          CXX=clang++-18 python3 tests/ai_application/test_compiled_cache.py build-profile build-profile/onnxruntime-1.30.0 2>&1 | tee profile-output/cache-tests.txt
          CXX=clang++-18 python3 tests/ai_application/test_runtime_phase_profile.py build-profile build-profile/onnxruntime-1.30.0 2>&1 | tee profile-output/phase-tests.txt
          CXX=clang++-18 SHORTHAND_AI_ENERGY_REQUIRE_ONNX=1 ONNXRUNTIME_ROOT="$PWD/build-profile/onnxruntime-1.30.0" \
            bash scripts/check_ai_energy_qualification.sh 2>&1 | tee profile-output/workspace-tests.txt
      - name: Run prepared cache and workspace sanitizers
        run: |
          set -euo pipefail
          scripts/check_prepared_cache_sanitizers.sh \
            "$PWD/build-profile/onnxruntime-1.30.0" "$PWD/build-profile-sanitized" \
            2>&1 | tee profile-output/prepared-sanitizers.txt
      - name: Verify real backend profiling and build independent C++ control
        run: |
          set -euo pipefail
          python3 scripts/create_digit_application_fixture.py profile-output/backend-test --batch 16 --threads 1
          SDK="$PWD/build-profile/onnxruntime-1.30.0"
          SRC=Compiler_new_ws/Short_Hand/src/ai_runtime
          clang++-18 -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -pthread -I. -I"$SDK/include" \
            -DSHORTHAND_HAS_ONNXRUNTIME=1 tests/ai_application/test_prepared_profile.cpp \
            "$SRC/backends/OnnxRuntimeBackend.cpp" "$SRC/AI_Types.cpp" "$SRC/AI_Telemetry.cpp" \
            -L"$SDK/lib" -Wl,-rpath,"$SDK/lib" -lonnxruntime -o build-profile/test-prepared-profile
          build-profile/test-prepared-profile profile-output/backend-test/digits.onnx
          PYTHONPATH=experiments/energy python3 - <<'PY'
          import pathlib
          from runtime_state_of_practice import compile_cpp_baseline
          compile_cpp_baseline(pathlib.Path('profile-output/cpp-build'), 'clang++-18',
                               pathlib.Path('build-profile/onnxruntime-1.30.0'))
          PY
      - name: Probe CI energy evidence capabilities
        run: |
          python3 experiments/energy/ci_energy_evidence.py probe \
            --profiles experiments/energy/calibration_profiles \
            --output profile-output/ci-energy-probe.json
          cat profile-output/ci-energy-probe.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build exact base runtime control
        run: |
          set -euo pipefail
          git worktree add --detach control-worktree "$EVIDENCE_BASE_SHA"
          SDK="$PWD/build-profile/onnxruntime-1.30.0"
          cmake -S control-worktree -B build-profile-base -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DSHORTHAND_BUILD_TESTING=OFF -DSHORTHAND_BUILD_MLIR=OFF \
            -DLLVM_CONFIG=/usr/bin/llvm-config-18 \
            -DSHORTHAND_ENABLE_ONNXRUNTIME=ON -DSHORTHAND_STRICT_OPTIONAL_BACKENDS=ON \
            -DONNXRUNTIME_ROOT="$SDK"
          cmake --build build-profile-base --parallel 2 --target shorthand_ai_qualify shorthand_runtime 2>&1 | tee profile-output/base-build.log
          test "$(git -C control-worktree rev-parse HEAD)" = "$EVIDENCE_BASE_SHA"
          sha256sum build-profile-base/shorthand_ai_qualify > profile-output/base-executable.sha256
          cp build-profile-base/CMakeCache.txt profile-output/base-CMakeCache.txt
      - name: Capture and replay actual compiled FP32 inference
        run: |
          set -euo pipefail
          baseline-venv/bin/python experiments/energy/generated_infer_evidence.py \
            --build build-profile --base-build build-profile-base --sdk build-profile/onnxruntime-1.30.0 \
            --head-sha "$(git rev-parse HEAD)" --base-sha "$EVIDENCE_BASE_SHA" \
            --output profile-output/generated-infer
          python3 experiments/energy/generated_infer_evidence.py --output profile-output/generated-infer \
            --replay-sha256 "$(cat profile-output/generated-infer/manifest.sha256)"
          cat profile-output/generated-infer/GENERATED.md >> "$GITHUB_STEP_SUMMARY"
      - name: Capture same-runner head/base runtime delta
        run: |
          set -euo pipefail
          baseline-venv/bin/python experiments/energy/pr_runtime_delta.py \
            --head-tool "$PWD/build-profile/shorthand_ai_qualify" \
            --base-tool "$PWD/build-profile-base/shorthand_ai_qualify" \
            --head-sha "$(git rev-parse HEAD)" \
            --base-sha "$EVIDENCE_BASE_SHA" \
            --output "$PWD/profile-output/pr-runtime-delta"
          cat profile-output/pr-runtime-delta/PR_DELTA.md >> "$GITHUB_STEP_SUMMARY"
      - name: Capture all five diagnostic cells
        run: |
          set -euo pipefail
          for cell in 1:1 16:1 32:1 16:2 16:4; do
            batch="${cell%:*}"
            threads="${cell#*:}"
            target="profile-output/b${batch}-t${threads}"
            python3 scripts/create_digit_application_fixture.py "$target" --batch "$batch" --threads "$threads"
            build-profile/shorthand_ai_qualify application-profile "$target/application.json" "$target/raw-profile.json"
            digest="$(sha256sum "$target/raw-profile.json" | cut -d' ' -f1)"
            python3 experiments/energy/profile_report.py --input "$target/raw-profile.json" --input-sha256 "$digest" --output "$target/report"
            cat "$target/report/PROFILE.md" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Capture and replay balanced resident baselines
        run: |
          set -euo pipefail
          baseline-venv/bin/python experiments/energy/resident_baselines.py run \
            --tool "$PWD/build-profile/shorthand_ai_qualify" \
            --cpp "$PWD/profile-output/cpp-build/cpp-onnx-baseline" \
            --output "$PWD/profile-output/resident-baselines"
          digest="$(sha256sum profile-output/resident-baselines/manifest.json | cut -d' ' -f1)"
          python3 experiments/energy/resident_baselines.py analyze \
            --bundle profile-output/resident-baselines --manifest-sha256 "$digest"
          cat profile-output/resident-baselines/BASELINES.md >> "$GITHUB_STEP_SUMMARY"
      - name: Capture separate CI component-energy comparison
        run: |
          set -euo pipefail
          python3 experiments/energy/ci_energy_compare.py \
            --tool "$PWD/build-profile/shorthand_ai_qualify" \
            --cpp "$PWD/profile-output/cpp-build/cpp-onnx-baseline" \
            --python "$PWD/baseline-venv/bin/python" \
            --profiles experiments/energy/calibration_profiles \
            --output "$PWD/profile-output/ci-energy"
          cat profile-output/ci-energy/ENERGY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Render repository benchmark report
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 experiments/energy/render_benchmark_markdown.py \
            --profile-dir profile-output --output profile-output/BENCHMARKS.md --run-url "$run_url"
          cat profile-output/BENCHMARKS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Finalize evidence index and reject missing evidence
        if: always()
        run: |
          status=0
          python3 experiments/energy/ci_run_evidence.py --output profile-output --job-status '${{ job.status }}' || status=$?
          cat profile-output/EVIDENCE.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Refresh finalized benchmark report and evidence hashes
        if: always()
        run: |
          set +e
          report_status=0
          python3 experiments/energy/render_benchmark_markdown.py \
            --profile-dir profile-output \
            --output profile-output/BENCHMARKS.md \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          report_status=$?
          finalize_status=0
          python3 experiments/energy/ci_run_evidence.py --output profile-output --job-status '${{ job.status }}' || finalize_status=$?
          cat profile-output/BENCHMARKS.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if (( report_status != 0 )); then exit "$report_status"; fi
          exit "$finalize_status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-profile-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: profile-output/
