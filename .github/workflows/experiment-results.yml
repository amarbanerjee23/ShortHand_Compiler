name: experiment-results

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/experiment-results.yml'
      - 'Compiler_new_ws/Short_Hand/src/ai_runtime/**'
      - 'experiments/energy/**'
      - 'scripts/install_ci_onnxruntime_cpu.sh'
      - 'tests/ai_application/**'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install LLVM 18 build dependencies
        run: |
          set -euo pipefail
          APT_SOURCES=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${APT_SOURCES[@]}" update
          sudo apt-get "${APT_SOURCES[@]}" install -y build-essential clang-18 llvm-18-dev llvm-18-tools libmlir-18-dev mlir-18-tools cmake ninja-build python3 python3-venv flex bison libfl-dev libssl-dev curl
      - name: Build the real compiler and ONNX runtime host
        run: |
          set -euo pipefail
          bash scripts/install_ci_onnxruntime_cpu.sh "$PWD/build-energy/onnxruntime-1.30.0"
          cmake -S . -B build-energy -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSHORTHAND_BUILD_TESTING=OFF -DSHORTHAND_BUILD_MLIR=ON -DSHORTHAND_MLIR_TESTING=OFF \
            -DMLIR_DIR=/usr/lib/llvm-18/lib/cmake/mlir -DLLVM_CONFIG=/usr/bin/llvm-config-18 \
            -DSHORTHAND_ENABLE_ONNXRUNTIME=ON -DSHORTHAND_STRICT_OPTIONAL_BACKENDS=ON \
            -DONNXRUNTIME_ROOT="$PWD/build-energy/onnxruntime-1.30.0"
          cmake --build build-energy --parallel 2 --target short_hand shorthand_ai_qualify
      - name: Install and record the pinned comparison environment
        run: |
          set -euo pipefail
          mkdir -p experiment-output
          python3 -m venv build-energy/venv
          build-energy/venv/bin/python -m pip install --only-binary=:all: --require-hashes -r tests/ai_application/requirements-ai-baseline-linux-x64-py312.txt
          build-energy/venv/bin/python -m pip install --only-binary=:all: --report experiment-output/pip-torch-install.json 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          build-energy/venv/bin/python -m pip freeze --all > experiment-output/pip-freeze.txt
          lscpu --json > experiment-output/lscpu.json
          build-energy/shorthand_ai_qualify probe > experiment-output/energy-probe.txt
      - name: Validate experiment correctness and rejection paths
        run: |
          build-energy/venv/bin/python experiments/energy/test_experiments.py --tool "$PWD/build-energy/shorthand_ai_qualify"
          build-energy/venv/bin/python experiments/energy/test_energy_status.py
      - name: Capture the predefined paired comparisons
        env:
          ONNXRUNTIME_ROOT: ${{ github.workspace }}/build-energy/onnxruntime-1.30.0
        run: |
          build-energy/venv/bin/python experiments/energy/run_verified.py \
            --output experiment-output --compiler "$PWD/build-energy/short_hand" \
            --clang /usr/bin/clang++-18 --tool "$PWD/build-energy/shorthand_ai_qualify" \
            --onnxruntime-root "$ONNXRUNTIME_ROOT"
      - name: Record physical-energy availability
        if: always()
        run: python3 experiments/energy/energy_status.py --output experiment-output/energy-status.json
      - name: Export durable observations and Markdown
        if: always()
        run: python3 experiments/energy/report_results.py --input experiment-output --output experiment-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: experiment-results-${{ github.run_id }}
          retention-days: 90
          path: |
            experiment-output/
            experiment-report/
