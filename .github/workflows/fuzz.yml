name: extended-fuzz

on:
  pull_request:
    paths:
      - 'Compiler_new_ws/Short_Hand/src/scanner_parser/**'
      - 'Compiler_new_ws/Short_Hand/src/parser/**'
      - 'Compiler_new_ws/Short_Hand/src/ast/**'
      - 'Compiler_new_ws/Short_Hand/src/main.cpp'
      - 'tests/parser/**'
      - 'tests/fuzz/**'
      - 'scripts/check_parser_lifetime.sh'
      - 'scripts/check_fuzz_sanitizers.sh'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install fuzz toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            g++ \
            flex \
            bison \
            libfl-dev \
            llvm \
            llvm-dev \
            clang

      - name: Build compiler frontend baseline
        run: make -C Compiler_new_ws/Short_Hand/src short_hand

      - name: Extended staged libFuzzer campaign
        env:
          SHORTHAND_FUZZ_MAX_TOTAL_TIME: '180'
          SHORTHAND_FUZZ_RUNS: '0'
          # Regress the seed from the audited parser OOM on parser PRs. Scheduled
          # campaigns continue to explore a visible, bounded run-number seed.
          SHORTHAND_FUZZ_SEED: ${{ github.event_name == 'pull_request' && 56 || github.run_number }}
          SHORTHAND_FUZZ_MAX_LEN: '4096'
          SHORTHAND_FUZZ_ARTIFACT_DIR: /tmp/shorthand_fuzz_artifacts
        run: bash scripts/check_fuzz_sanitizers.sh

      - name: Runtime ASan LSan UBSan extended stress
        run: bash scripts/check_runtime_memory_sanitizer.sh

      - name: ThreadSanitizer extended race stress
        run: bash scripts/check_thread_sanitizer.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: extended-fuzz-${{ github.run_id }}
          path: |
            /tmp/shorthand_fuzz_*.out
            /tmp/shorthand_fuzz_build_*.out
            /tmp/shorthand_fuzz_build_*.err
            /tmp/shorthand_fuzz_artifacts/
            /tmp/shorthand_runtime_memory_sanitizer.out
            /tmp/shorthand_runtime_memory_sanitizer.err
            /tmp/shorthand_tsan_runtime.out
            /tmp/shorthand_tsan_runtime.err
