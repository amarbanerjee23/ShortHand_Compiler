name: agent-fix-pr82-contextual-keywords

on:
  push:
    branches:
      - agent/pr82-c3eco-language-blocks
    paths:
      - .github/workflows/agent-fix-pr82-contextual-keywords.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/pr82-c3eco-language-blocks
          fetch-depth: 0

      - name: Install parser build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libfl-dev llvm llvm-dev clang

      - name: Make PR82 keywords contextual and preserve beta compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          scanner_path = Path('Compiler_new_ws/Short_Hand/src/scanner_parser/scanner.ll')
          scanner = scanner_path.read_text()
          keyword_lines = [
              '"certification" return CERTIFICATION;\n',
              '"workload" return WORKLOAD;\n',
              '"measurement_plan" return MEASUREMENT_PLAN;\n',
              '"ai_lifecycle" return AI_LIFECYCLE;\n',
              '"rag_pipeline" return RAG_PIPELINE;\n',
              '"token_budget" return TOKEN_BUDGET;\n',
              '"model_routing" return MODEL_ROUTING;\n',
              '"guardrails" return GUARDRAILS;\n',
          ]
          for line in keyword_lines:
              if scanner.count(line) != 1:
                  raise SystemExit(f'expected exactly one scanner keyword line: {line.strip()}')
              scanner = scanner.replace(line, '')
          scanner_path.write_text(scanner)

          parser_path = Path('Compiler_new_ws/Short_Hand/src/scanner_parser/parser.yy')
          parser = parser_path.read_text()

          token_line = '%token CERTIFICATION WORKLOAD MEASUREMENT_PLAN AI_LIFECYCLE RAG_PIPELINE TOKEN_BUDGET MODEL_ROUTING GUARDRAILS\n'
          if parser.count(token_line) != 1:
              raise SystemExit('expected C3 global token declaration exactly once')
          parser = parser.replace(token_line, '')

          begin_fn = '''static void shorthand_begin_c3eco(C3EcoDeclarationKind kind, const char *name) {
    current_c3eco = C3EcoDeclarationData();
    current_c3eco.kind = kind;
    current_c3eco.name = name == nullptr ? "" : std::string(name);
}

'''
          contextual_fn = '''static bool shorthand_contextual_c3eco_kind(const char *keyword,
                                              C3EcoDeclarationKind *kind) {
    if (keyword == nullptr || kind == nullptr) return false;
    const std::string text(keyword);
    if (text == "certification") { *kind = C3EcoDeclarationKind::Certification; return true; }
    if (text == "workload") { *kind = C3EcoDeclarationKind::Workload; return true; }
    if (text == "measurement_plan") { *kind = C3EcoDeclarationKind::MeasurementPlan; return true; }
    if (text == "ai_lifecycle") { *kind = C3EcoDeclarationKind::AILifecycle; return true; }
    if (text == "rag_pipeline") { *kind = C3EcoDeclarationKind::RAGPipeline; return true; }
    if (text == "token_budget") { *kind = C3EcoDeclarationKind::TokenBudget; return true; }
    if (text == "model_routing") { *kind = C3EcoDeclarationKind::ModelRouting; return true; }
    if (text == "guardrails") { *kind = C3EcoDeclarationKind::Guardrails; return true; }
    return false;
}

'''
          if parser.count(begin_fn) != 1:
              raise SystemExit('expected shorthand_begin_c3eco helper exactly once')
          parser = parser.replace(begin_fn, begin_fn + contextual_fn)

          start = parser.index('C3ECO_DECLARATION:\n')
          end = parser.index('C3ECO_FIELD_LIST:', start)
          new_decl = '''C3ECO_DECLARATION:
      IDENTIFIER IDENTIFIER '{' {
          C3EcoDeclarationKind kind;
          if (!shorthand_contextual_c3eco_kind($1, &kind)) {
              shorthand_parser_diagnostic(shorthand::diagnostics::ParserSyntaxError,
                                          "expected a C3-ECO declaration keyword", @1);
              YYERROR;
          }
          shorthand_begin_c3eco(kind, $2);
      } C3ECO_FIELD_LIST '}' ';' { $$=located(new AST_C3ECO_DECLARATION(current_c3eco), @$); }
    | FUNCTIONAL_UNIT IDENTIFIER '{' { shorthand_begin_c3eco(C3EcoDeclarationKind::FunctionalUnit, $2); } C3ECO_FIELD_LIST '}' ';' { $$=located(new AST_C3ECO_DECLARATION(current_c3eco), @$); }
    | BOUNDARY IDENTIFIER '{' { shorthand_begin_c3eco(C3EcoDeclarationKind::Boundary, $2); } C3ECO_FIELD_LIST '}' ';' { $$=located(new AST_C3ECO_DECLARATION(current_c3eco), @$); };
'''
          parser = parser[:start] + new_decl + parser[end:]
          parser_path.write_text(parser)

          gate_path = Path('scripts/check_c3eco_language_blocks.sh')
          gate = gate_path.read_text()
          marker = 'expect_code c3eco_unsafe_claim.short SHD5104\n\necho "PASS C3-ECO first-class language blocks grammar AST semantics evidence and claim-safety gate"\n'
          replacement = '''expect_code c3eco_unsafe_claim.short SHD5104

cat >"${WORK_DIR}/contextual_keywords.short" <<'EOF'
int certification;
int workload;
int measurement_plan;
int ai_lifecycle;
int rag_pipeline;
int token_budget;
int model_routing;
int guardrails;
certification = 1;
workload = 2;
measurement_plan = 3;
ai_lifecycle = 4;
rag_pipeline = 5;
token_budget = 6;
model_routing = 7;
guardrails = 8;
EOF
"${SHORT}" "${WORK_DIR}/contextual_keywords.short" parse >/dev/null

echo "PASS C3-ECO first-class language blocks grammar AST semantics evidence claim-safety and contextual-keyword compatibility gate"
'''
          if gate.count(marker) != 1:
              raise SystemExit('expected C3-ECO gate completion marker exactly once')
          gate_path.write_text(gate.replace(marker, replacement))

          for doc_path in [Path('scripts/check_feature_plan_status.sh')]:
              doc = doc_path.read_text()
              old = 'PASS C3-ECO first-class language blocks grammar AST semantics evidence and claim-safety gate'
              new = 'PASS C3-ECO first-class language blocks grammar AST semantics evidence claim-safety and contextual-keyword compatibility gate'
              if old in doc:
                  doc_path.write_text(doc.replace(old, new))
          PY

      - name: Validate grammar compatibility and C3 contract
        shell: bash
        run: |
          set -euo pipefail
          cd Compiler_new_ws/Short_Hand/src
          bison -Werror=conflicts-sr -Werror=conflicts-rr --debug -v -d scanner_parser/parser.yy -o parser.tab.cc
          flex scanner_parser/scanner.ll
          cd ../../..
          make -C Compiler_new_ws/Short_Hand/src clean short_hand
          Compiler_new_ws/Short_Hand/build/short_hand tests/conformance/beta_0_2/greenai_language.short parse >/dev/null
          SHORTHAND_BIN=Compiler_new_ws/Short_Hand/build/short_hand bash scripts/check_c3eco_language_blocks.sh
          git diff --check

      - name: Commit contextual-keyword compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-fix-pr82-contextual-keywords.yml
          git add Compiler_new_ws/Short_Hand/src/scanner_parser/scanner.ll \
                  Compiler_new_ws/Short_Hand/src/scanner_parser/parser.yy \
                  scripts/check_c3eco_language_blocks.sh \
                  scripts/check_feature_plan_status.sh
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "PR82: preserve beta grammar with contextual C3-ECO keywords"
          git push origin HEAD:agent/pr82-c3eco-language-blocks
