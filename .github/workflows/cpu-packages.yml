name: cpu-release-packages

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: v1.0.0-rc.1

permissions:
  contents: read

env:
  SHORTHAND_PACKAGE_VERSION: ${{ inputs.version }}

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install qualified Linux x64 dependencies
        run: |
          # Only Ubuntu packages are required here. An unrelated Chrome index
          # hash mismatch must not prevent qualification dependencies installing.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          APT_SOURCES=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${APT_SOURCES[@]}" update
          sudo apt-get "${APT_SOURCES[@]}" install -y libssl-dev openssl python3 python3-venv jq build-essential flex bison libfl-dev llvm-18 llvm-18-dev libmlir-18-dev mlir-18-tools llvm-18-tools clang-18 cmake ninja-build
      - name: Acquire pinned ONNX Runtime CPU SDK
        run: |
          bash scripts/install_ci_onnxruntime_cpu.sh "$PWD/.onnxruntime-cpu"
      - name: Build, execute and stage Linux x64
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          set -euo pipefail
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/stage-release" -DLLVM_CONFIG=/usr/bin/llvm-config-18 -DSHORTHAND_BUILD_MLIR=ON -DMLIR_DIR=/usr/lib/llvm-18/lib/cmake/mlir -DSHORTHAND_MLIR_TESTING=OFF -DSHORTHAND_ENABLE_ONNXRUNTIME=ON -DSHORTHAND_STRICT_OPTIONAL_BACKENDS=ON -DONNXRUNTIME_ROOT="$PWD/.onnxruntime-cpu"
          cmake --build build-release --parallel 2
          cmake --install build-release
          ONNXRUNTIME_ROOT="$PWD/.onnxruntime-cpu" LLVM_CONFIG=/usr/bin/llvm-config-18 bash scripts/check_mlir_dialect.sh
          cmake --install build-mlir --prefix "$PWD/stage-release"
          bash scripts/prepare_release_bundle.sh "${SHORTHAND_PACKAGE_VERSION}" linux-x64 "$PWD/stage-release" "$PWD/release-linux-x64"
          bash scripts/verify_release_bundle.sh "$PWD/release-linux-x64"
          version="${SHORTHAND_PACKAGE_VERSION}"
          python3 scripts/check_installed_cpu_package.py "$PWD/release-linux-x64/shorthand-${version#v}-linux-x64.tar" linux-x64 \
            --sdk "$PWD/.onnxruntime-cpu" --build "$PWD/build-release" \
            --report "$PWD/release-linux-x64/shorthand-linux-x64.cpu-qualification.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-bundle-linux-x64
          path: release-linux-x64/
          if-no-files-found: error

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install qualified Linux arm64 dependencies
        run: |
          # Only Ubuntu packages are required here. An unrelated Chrome index
          # hash mismatch must not prevent qualification dependencies installing.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          APT_SOURCES=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${APT_SOURCES[@]}" update
          sudo apt-get "${APT_SOURCES[@]}" install -y libssl-dev openssl python3 python3-venv jq build-essential flex bison libfl-dev llvm llvm-dev clang cmake ninja-build
      - name: Acquire pinned ONNX Runtime CPU SDK
        run: |
          bash scripts/install_ci_onnxruntime_cpu.sh "$PWD/.onnxruntime-cpu"
      - name: Build, execute and stage Linux arm64
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(llvm-config --version | cut -d. -f1)" = 18
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/stage-release" -DSHORTHAND_ENABLE_ONNXRUNTIME=ON -DSHORTHAND_STRICT_OPTIONAL_BACKENDS=ON -DONNXRUNTIME_ROOT="$PWD/.onnxruntime-cpu"
          cmake --build build-release --parallel 2
          cmake --install build-release
          bash scripts/prepare_release_bundle.sh "${SHORTHAND_PACKAGE_VERSION}" linux-arm64 "$PWD/stage-release" "$PWD/release-linux-arm64"
          bash scripts/verify_release_bundle.sh "$PWD/release-linux-arm64"
          version="${SHORTHAND_PACKAGE_VERSION}"
          python3 scripts/check_installed_cpu_package.py "$PWD/release-linux-arm64/shorthand-${version#v}-linux-arm64.tar" linux-arm64 \
            --sdk "$PWD/.onnxruntime-cpu" --build "$PWD/build-release" \
            --report "$PWD/release-linux-arm64/shorthand-linux-arm64.cpu-qualification.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-bundle-linux-arm64
          path: release-linux-arm64/
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install qualified macOS dependencies
        run: |
          brew install bison flex llvm@18 ninja openssl@3 jq
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Acquire pinned ONNX Runtime CPU SDK
        run: |
          bash scripts/install_ci_onnxruntime_cpu.sh "$PWD/.onnxruntime-cpu"
      - name: Build, execute and stage macOS arm64
        env:
          CC: /opt/homebrew/opt/llvm@18/bin/clang
          CXX: /opt/homebrew/opt/llvm@18/bin/clang++
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/stage-release" -DLLVM_CONFIG="$(brew --prefix llvm@18)/bin/llvm-config" -DSHORTHAND_ENABLE_ONNXRUNTIME=ON -DSHORTHAND_STRICT_OPTIONAL_BACKENDS=ON -DONNXRUNTIME_ROOT="$PWD/.onnxruntime-cpu"
          cmake --build build-release --parallel 2
          cmake --install build-release
          bash scripts/prepare_release_bundle.sh "${SHORTHAND_PACKAGE_VERSION}" macos-arm64 "$PWD/stage-release" "$PWD/release-macos-arm64"
          bash scripts/verify_release_bundle.sh "$PWD/release-macos-arm64"
          version="${SHORTHAND_PACKAGE_VERSION}"
          python3 scripts/check_installed_cpu_package.py "$PWD/release-macos-arm64/shorthand-${version#v}-macos-arm64.tar" macos-arm64 \
            --sdk "$PWD/.onnxruntime-cpu" --build "$PWD/build-release" \
            --report "$PWD/release-macos-arm64/shorthand-macos-arm64.cpu-qualification.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-bundle-macos-arm64
          path: release-macos-arm64/
          if-no-files-found: error

  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 80
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: 1
    defaults:
      run:
        shell: 'C:\msys64\usr\bin\bash.exe -leo pipefail {0}'
    steps:
      - name: Preserve source line endings across Windows and MSYS2 Git
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record checkout normalization policy for both Git installations
        shell: pwsh
        run: git config --local core.autocrlf false
      - name: Install qualified Windows dependencies
        run: |
          packages=(mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-python openssl jq bison flex make diffutils git)
          for attempt in 1 2 3 4; do
            if pacman -Syy --noconfirm --needed "${packages[@]}"; then exit 0; fi
            echo "MSYS2 dependency transaction failed (attempt ${attempt}/4)" >&2
            sleep "$((attempt * 15))"
          done
          exit 1
      - name: Install pinned Windows LLVM 22 toolchain
        run: bash scripts/install_ci_windows_llvm.sh
      - name: Acquire pinned ONNX Runtime CPU SDK
        run: |
          export PATH="/ucrt64/bin:/usr/bin:${PATH}"
          bash scripts/install_ci_onnxruntime_cpu.sh "$PWD/.onnxruntime-cpu"
      - name: Build, execute and stage Windows x64
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:${PATH}"
          export CC=clang
          export CXX=clang++
          test "$(llvm-config --version | cut -d. -f1)" = 22
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/stage-release" -DLLVM_CONFIG=/ucrt64/bin/llvm-config.exe -DSHORTHAND_ENABLE_ONNXRUNTIME=ON -DSHORTHAND_STRICT_OPTIONAL_BACKENDS=ON -DONNXRUNTIME_ROOT="$PWD/.onnxruntime-cpu"
          cmake --build build-release --parallel 2
          cmake --install build-release
          bash scripts/prepare_release_bundle.sh "${SHORTHAND_PACKAGE_VERSION}" windows-x64 "$PWD/stage-release" "$PWD/release-windows-x64"
          bash scripts/verify_release_bundle.sh "$PWD/release-windows-x64"
          version="${SHORTHAND_PACKAGE_VERSION}"
          python3 scripts/check_installed_cpu_package.py "$PWD/release-windows-x64/shorthand-${version#v}-windows-x64.tar" windows-x64 \
            --sdk "$PWD/.onnxruntime-cpu" --build "$PWD/build-release" \
            --report "$PWD/release-windows-x64/shorthand-windows-x64.cpu-qualification.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-bundle-windows-x64
          path: release-windows-x64/
          if-no-files-found: error

  candidate-bundles:
    needs: [linux-x64, linux-arm64, macos-arm64, windows-x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          pattern: release-bundle-*
          path: release-assets
      - name: Verify complete native candidate set
        run: python3 scripts/verify_release_candidates.py release-assets --revision "$GITHUB_SHA"
