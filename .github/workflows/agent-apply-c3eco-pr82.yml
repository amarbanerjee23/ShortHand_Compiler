name: agent-apply-c3eco-pr82

on:
  push:
    branches:
      - agent/pr82-c3eco-language-blocks
    paths:
      - .github/workflows/agent-apply-c3eco-pr82.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'amarbanerjee23/ShortHand_Compiler'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/pr82-c3eco-language-blocks
          fetch-depth: 0

      - name: Reconstruct verified PR82 implementation payload
        shell: bash
        env:
          SOURCE_COMMIT: 87a8aa669f09894a431cf12477107746c516d358
          ARCHIVE_SHA256: 606499a5995c4ac1ea36abc3146a16695a58eb41e5a6b2c6da56965155a6cfcb
        run: |
          set -euo pipefail
          payload_b64="${RUNNER_TEMP}/pr82-payload.b64"
          : > "${payload_b64}"
          for part in \
            .agent-pr82-payload.part00 \
            .agent-pr82-payload.part01 \
            .agent-pr82-payload.part020 \
            .agent-pr82-payload.part021 \
            .agent-pr82-payload.part022 \
            .agent-pr82-payload.part0230 \
            .agent-pr82-payload.part0231 \
            .agent-pr82-payload.part03; do
            git show "${SOURCE_COMMIT}:${part}" >> "${payload_b64}"
          done
          base64 --decode "${payload_b64}" > "${RUNNER_TEMP}/pr82-payload.tar.gz"
          printf '%s  %s\n' "${ARCHIVE_SHA256}" "${RUNNER_TEMP}/pr82-payload.tar.gz" | sha256sum --check --strict
          gzip -t "${RUNNER_TEMP}/pr82-payload.tar.gz"
          mkdir -p "${RUNNER_TEMP}/pr82-payload"
          tar -xzf "${RUNNER_TEMP}/pr82-payload.tar.gz" -C "${RUNNER_TEMP}/pr82-payload"
          test -s "${RUNNER_TEMP}/pr82-payload/changes.patch"

      - name: Apply compiler feature patch without CI workflow regression
        shell: bash
        run: |
          set -euo pipefail
          patch="${RUNNER_TEMP}/pr82-payload/changes.patch"
          if grep -Eq '^diff --git a/(\.github/|ci/|scripts/check_ci_status_hygiene\.sh)' "${patch}"; then
            echo "note: infrastructure paths are present in historical payload and will be explicitly excluded"
          fi
          git apply --check \
            --exclude='.github/**' \
            --exclude='ci/**' \
            --exclude='scripts/check_ci_status_hygiene.sh' \
            --exclude='.agent-*' \
            "${patch}"
          git apply --index \
            --exclude='.github/**' \
            --exclude='ci/**' \
            --exclude='scripts/check_ci_status_hygiene.sh' \
            --exclude='.agent-*' \
            "${patch}"
          git rm -- .github/workflows/agent-apply-c3eco-pr82.yml
          git diff --cached --check
          if git diff --cached --name-only | grep -Eq '^(\.github/|ci/|scripts/check_ci_status_hygiene\.sh$|\.agent-)'; then
            echo "error: historical payload attempted to stage protected CI/staging paths" >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          while IFS= read -r script; do
            bash -n "${script}"
          done < <(git diff --cached --name-only --diff-filter=ACM | grep -E '\.sh$' || true)

      - name: Commit C3-ECO implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "PR82: implement C3-ECO language blocks and zero-skip qualification"
          git push origin HEAD:agent/pr82-c3eco-language-blocks
