  <line class="grid" x1="333.8" y1="115" x2="333.8" y2="405"/>
  <text class="tick" x="333.8" y="422" text-anchor="middle">5</text>
  <line class="grid" x1="367.3" y1="115" x2="367.3" y2="405"/>
  <text class="tick" x="367.3" y="422" text-anchor="middle">10</text>
  <line class="grid" x1="411.5" y1="115" x2="411.5" y2="405"/>
  <text class="tick" x="411.5" y="422" text-anchor="middle">25</text>
  <text class="axis-label" x="295.0" y="442" text-anchor="middle">Resident Inner-Trial Latency (µs/image, log scale)</text>
  <text class="axis-label" x="137" y="144" text-anchor="end">b1-t1 (live)</text>
  <rect x="145" y="124" width="135.3" height="11" fill="#0d9488" rx="2"/>
  <text class="val" x="284.3" y="133">C++ ORT: 1.647 µs</text>
