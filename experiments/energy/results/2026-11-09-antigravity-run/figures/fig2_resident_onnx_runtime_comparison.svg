  <text class="val" x="205.4" y="243">C++ ORT: 0.322 µs</text>
  <rect x="145" y="248" width="85.7" height="11" fill="#0284c7" rx="2"/>
  <text class="val" x="234.7" y="257">ShortHand: 0.590 µs</text>
  <rect x="145" y="262" width="139.2" height="11" fill="#6366f1" rx="2"/>
  <text class="val" x="288.2" y="271">Python ORT: 1.789 µs</text>
  <text class="axis-label" x="137" y="309" text-anchor="end">b32-t1 (live)</text>
  <rect x="145" y="289" width="48.2" height="11" fill="#0d9488" rx="2"/>
  <text class="val" x="197.2" y="298">C++ ORT: 0.271 µs</text>
  <rect x="145" y="303" width="78.6" height="11" fill="#0284c7" rx="2"/>
  <text class="val" x="227.6" y="312">ShortHand: 0.509 µs</text>
  <rect x="145" y="317" width="113.4" height="11" fill="#6366f1" rx="2"/>
