  <text class="val" x="221.5" y="353">C++ ORT: 0.449 µs</text>
  <rect x="145" y="358" width="101.0" height="11" fill="#0284c7" rx="2"/>
  <text class="val" x="250.0" y="367">ShortHand: 0.809 µs</text>
  <rect x="145" y="372" width="167.1" height="11" fill="#6366f1" rx="2"/>
  <text class="val" x="316.1" y="381">Python ORT: 3.184 µs</text>
  <line class="grid" x1="620.0" y1="115" x2="620.0" y2="405"/>
  <text class="tick" x="620.0" y="422" text-anchor="middle">-100%</text>
  <line class="grid" x1="697.5" y1="115" x2="697.5" y2="405"/>
  <text class="tick" x="697.5" y="422" text-anchor="middle">-50%</text>
  <line class="axis" x1="775.0" y1="115" x2="775.0" y2="405"/>
  <text class="tick" x="775.0" y="422" text-anchor="middle">0%</text>
  <line class="grid" x1="852.5" y1="115" x2="852.5" y2="405"/>
  <text class="tick" x="852.5" y="422" text-anchor="middle">50%</text>
  <line class="grid" x1="930.0" y1="115" x2="930.0" y2="405"/>
  <text class="tick" x="930.0" y="422" text-anchor="middle">100%</text>
  <text class="axis-label" x="775.0" y="442" text-anchor="middle">ShortHand Latency Reduction % (left = slower than C++; right = faster than Python)</text>
  <text class="axis-label" x="612" y="146" text-anchor="end">b1-t1 (live)</text>
  <rect x="775.0" y="128" width="135.7" height="14" fill="#0284c7" rx="2"/>
  <text class="val" x="914.7" y="139">+87.6% (vs Python)</text>
  <rect x="679.4" y="146" width="95.6" height="14" fill="#e11d48" rx="2"/>
  <text class="val" x="675.4" y="157" text-anchor="end">-61.7% (vs C++)</text>
  <text class="axis-label" x="612" y="201" text-anchor="end">b16-t1 (live)</text>
  <rect x="775.0" y="183" width="103.7" height="14" fill="#0284c7" rx="2"/>
  <text class="val" x="882.7" y="194">+66.9% (vs Python)</text>
  <rect x="641.3" y="201" width="133.7" height="14" fill="#e11d48" rx="2"/>
  <text class="val" x="637.3" y="212" text-anchor="end">-86.3% (vs C++)</text>
  <text class="axis-label" x="612" y="256" text-anchor="end">b16-t2 (live)</text>
  <rect x="775.0" y="238" width="103.9" height="14" fill="#0284c7" rx="2"/>
  <text class="val" x="882.9" y="249">+67.0% (vs Python)</text>
  <rect x="644.3" y="256" width="130.7" height="14" fill="#e11d48" rx="2"/>
  <text class="val" x="640.3" y="267" text-anchor="end">-84.3% (vs C++)</text>
  <text class="axis-label" x="612" y="311" text-anchor="end">b32-t1 (live)</text>
  <rect x="775.0" y="293" width="79.6" height="14" fill="#0284c7" rx="2"/>
  <text class="val" x="858.6" y="304">+51.3% (vs Python)</text>
  <rect x="641.4" y="311" width="133.6" height="14" fill="#e11d48" rx="2"/>
  <text class="val" x="637.4" y="322" text-anchor="end">-86.2% (vs C++)</text>
  <text class="axis-label" x="612" y="366" text-anchor="end">b16-t4 (4vCPU ref)</text>
  <rect x="775.0" y="348" width="115.6" height="14" fill="#0284c7" rx="2"/>
  <text class="val" x="894.6" y="359">+74.6% (vs Python)</text>
  <rect x="652.7" y="366" width="122.3" height="14" fill="#e11d48" rx="2"/>
  <text class="val" x="648.7" y="377" text-anchor="end">-78.9% (vs C++)</text>
  <text class="note" x="28" y="480">ShortHand beats Resident Python ORT by 51.3%–87.6%, but trails direct C++ ORT by 1.62×–1.86× due to host validation &amp; telemetry.</text>
</svg>
