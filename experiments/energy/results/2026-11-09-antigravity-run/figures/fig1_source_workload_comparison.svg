  <text class="axis-label" x="305.0" y="442" text-anchor="middle">Elapsed Time per Classified Image (ms/image, log scale — lower is faster)</text>
  <text class="axis-label" x="157" y="143" text-anchor="end">ShortHand (LLVM -O2)</text>
  <rect x="165" y="128" width="65.5" height="14" fill="#0284c7" rx="3"/>
  <text class="val" x="235.5" y="139">R=10: 0.000864</text>
