  <text class="val" x="912.5" y="301" text-anchor="start">R=100: +94.72% [94.7, 94.7]</text>
  <text class="axis-label" x="625" y="351" text-anchor="end">vs. torch.compile</text>
  <rect x="682.5" y="333" width="237.0" height="16" fill="#e11d48" fill-opacity="1.0" rx="3"/>
  <text class="val" x="924.5" y="345" text-anchor="start">R=10: +99.78% [99.8, 99.8]</text>
  <rect x="682.5" y="355" width="235.4" height="16" fill="#e11d48" fill-opacity="0.62" rx="3"/>
  <text class="val" x="922.9" y="367" text-anchor="start">R=100: +99.12% [99.1, 99.1]</text>
