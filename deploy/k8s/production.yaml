apiVersion: v1
kind: Namespace
metadata:
  name: shorthand-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shorthand-runtime
  namespace: shorthand-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: shorthand-runtime-quota
  namespace: shorthand-system
spec:
  hard:
    pods: "10"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shorthand
  namespace: shorthand-system
  labels:
    app.kubernetes.io/name: shorthand
    app.kubernetes.io/component: compiler-runtime
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shorthand
      app.kubernetes.io/component: compiler-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shorthand
        app.kubernetes.io/component: compiler-runtime
    spec:
      serviceAccountName: shorthand-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shorthand
          image: shorthand:pr87
          imagePullPolicy: IfNotPresent
          command: ["/opt/shorthand/Compiler_new_ws/Short_Hand/build/shorthand_serving_worker"]
          args:
            - serve
            - --tenant
            - default
            - --state-file
            - /tmp/shorthand-serving-health.json
            - --workers
            - "2"
            - --queue-capacity
            - "64"
            - --max-in-flight
            - "66"
            - --max-request-bytes
            - "1048576"
            - --max-response-bytes
            - "1048576"
            - --max-in-flight-request-bytes
            - "67108864"
            - --max-retained-result-bytes
            - "67108864"
            - --max-deadline-ms
            - "30000"
            - --grace-ms
            - "15000"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            exec:
              command:
                - /opt/shorthand/Compiler_new_ws/Short_Hand/build/shorthand_serving_worker
                - probe
                - --state-file
                - /tmp/shorthand-serving-health.json
                - --live
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /opt/shorthand/Compiler_new_ws/Short_Hand/build/shorthand_serving_worker
                - probe
                - --state-file
                - /tmp/shorthand-serving-health.json
                - --ready
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /opt/shorthand/Compiler_new_ws/Short_Hand/build/shorthand_serving_worker
                - probe
                - --state-file
                - /tmp/shorthand-serving-health.json
                - --live
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/bash", "-lc", "kill -USR1 1 && sleep 1"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /work
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shorthand
  namespace: shorthand-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shorthand
      app.kubernetes.io/component: compiler-runtime
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shorthand-default-deny
  namespace: shorthand-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shorthand
      app.kubernetes.io/component: compiler-runtime
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
